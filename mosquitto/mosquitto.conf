# battery-hub —— Mosquitto 配置（备选方案，默认不用）

# 本项目主链路是 HTTP，`hub/broker.py` + 这份配置只在你想接 MQTT 生态时用。
# 用法（手工启动，不装系统服务）：
#   mosquitto -c mosquitto/mosquitto.conf -v

listener 1883 0.0.0.0

allow_anonymous true

# retained 必须开，新上线的订阅者才能立刻拿到全网快照
persistence true
# 改成你自己的数据目录（相对路径按启动时的工作目录算）
persistence_location ./data/

log_dest stdout
log_type error
log_type warning
log_type information

max_connections 32
max_queued_messages 200
